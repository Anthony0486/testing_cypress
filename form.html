<!doctype html>
<html lang="en" data-theme="light">
<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Inscription Adhérent - DaisyUI</title>
</head>
<body class="min-h-screen bg-base-200 flex flex-col">
    <header class="navbar bg-base-100 shadow-md px-4 md:px-8 z-50">
        <div class="flex-1">
            <a class="btn btn-ghost text-xl normal-case font-bold text-primary" href="/index.html">Jefff.test</a>
        </div>
        <div class="flex-none">
            <ul class="menu menu-horizontal px-1 gap-2">
                <li><a href="/index.html">Home</a></li>
                <li><a href="calc.html">Calc</a></li>
                <li><a href="api.html">API</a></li>
                <li><a href="form.html" class="active bg-primary text-primary-content">Form</a></li>
                <li><a class="disabled opacity-50 pointer-events-none">Disabled</a></li>
            </ul>
        </div>
    </header>

    <main class="grow p-4 md:p-8 flex items-center justify-center">
        <div class="max-w-2xl w-full card bg-base-100 shadow-2xl">
            <div class="card-body p-8 md:p-12">
                <div class="flex items-center gap-4 mb-8">
                    <div class="p-3 bg-primary/10 rounded-lg text-primary">
                        <svg xmlns="http://www.w3.org/2000/svg" class="h-8 w-8" fill="none" viewBox="0 0 24 24" stroke="currentColor">
                            <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M18 9v3m0 0v3m0-3h3m-3 0h-3m-2-5a4 4 0 11-8 0 4 4 0 018 0zM3 20a6 6 0 0112 0v1H3v-1z" />
                        </svg>
                    </div>
                    <h2 class="card-title text-3xl font-black">Nouvel Adhérent</h2>
                </div>
                
                <form id="userForm" class="space-y-6">
                    <div class="form-control">
                        <label class="label"><span class="label-text font-bold uppercase text-xs opacity-60">Identité</span></label>
                        <input type="text" id="fullName" name="fullName" placeholder="Jean Dupont" class="input input-bordered focus:input-primary w-full" required />
                    </div>

                    <div class="form-control">
                        <label class="label"><span class="label-text font-bold uppercase text-xs opacity-60">Contact</span></label>
                        <input type="email" id="email" name="email" placeholder="jean@example.com" class="input input-bordered focus:input-primary w-full" required />
                    </div>

                    <div class="grid grid-cols-1 md:grid-cols-2 gap-6">
                        <div class="form-control">
                            <label class="label"><span class="label-text font-bold uppercase text-xs opacity-60">Abonnement</span></label>
                            <select id="subscription" name="subscription" class="select select-bordered focus:select-primary w-full">
                                <option disabled selected>Choisir un type...</option>
                                <option value="student">Étudiant</option>
                                <option value="adult">Adulte</option>
                                <option value="senior">Senior</option>
                            </select>
                        </div>
                        
                        <div class="form-control">
                            <label class="label"><span class="label-text font-bold uppercase text-xs opacity-60">Naissance</span></label>
                            <input type="date" id="birthDate" name="birthDate" class="input input-bordered focus:input-primary w-full" />
                        </div>
                    </div>

                    <div class="form-control bg-base-200 p-4 rounded-xl transition-all hover:bg-base-300">
                        <label class="label cursor-pointer justify-start gap-4">
                            <input type="checkbox" id="newsletter" name="newsletter" class="checkbox checkbox-primary" />
                            <span class="label-text font-medium">S'abonner à la newsletter de la bibliothèque</span>
                        </label>
                    </div>

                    <div class="card-actions justify-end mt-4">
                        <button type="submit" class="btn btn-primary btn-block md:btn-wide shadow-lg">
                            Enregistrer l'adhérent
                        </button>
                    </div>
                </form>

                <div id="successMsg" class="alert alert-success mt-6 hidden shadow-lg animate-bounce">
                    <svg xmlns="http://www.w3.org/2000/svg" class="stroke-current shrink-0 h-6 w-6" fill="none" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M9 12l2 2 4-4m6 2a9 9 0 11-18 0 9 9 0 0118 0z" /></svg>
                    <span class="font-bold">Utilisateur enregistré avec succès !</span>
                </div>
            </div>
        </div>
    </main>

    <script type="module" src="/src/form.js"></script>
</body>
</html>
